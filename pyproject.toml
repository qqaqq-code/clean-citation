[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-citaton"
version = "1.0.0"
description = "Resolve citations through official sources, OpenReview, and arXiv."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Clean Citaton contributors" }]
keywords = ["citations", "bibtex", "arxiv", "openreview", "ieee", "proceedings"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.scripts]
clean-citaton = "citation_verifier.cli:main"

[tool.setuptools]
package-dir = { "" = "skills/clean-citaton/scripts" }

[tool.setuptools.packages.find]
where = ["skills/clean-citaton/scripts"]
